    <script>
        // Fetch and display all artwork records on page load
        fetch('/artwork/?limit=100', { method: 'GET' })
            .then((response) => {
                return new Promise((resolve) => response.json()
                    .then((json) => resolve({
                        status: response.status,
                        json,
                    })
                ));
            })
            .then(({ status, json }) => {
                console.log(status, json);
                if (200 === status) {
                    const recordsContainer = document.getElementById('records-container');
                    if (json.data && json.data.length > 0) {
                        let recordsHTML = '<table class="table table-striped"><thead><tr>';
                        recordsHTML += '<th>ID</th><th>Experience</th><th>Subjects</th><th>Output Length</th><th>Idea</th><th>Drafts</th><th>Actions</th>';
                        recordsHTML += '</tr></thead><tbody>';
                        
                        for (let record of json.data) {
                            recordsHTML += '<tr>';
                            recordsHTML += '<td>' + record.id + '</td>';
                            recordsHTML += '<td>' + record.experience_level + '</td>';
                            recordsHTML += '<td>' + record.number_of_subjects + '</td>';
                            recordsHTML += '<td>' + record.output_length + '</td>';
                            recordsHTML += '<td>' + (record.idea_description.substring(0, 50) + '...') + '</td>';
                            recordsHTML += '<td>' + record.number_of_drafts + '</td>';
                            recordsHTML += '<td><a href="edit.html?id=' + record.id + '" class="btn btn-sm btn-warning">Edit</a></td>';
                            recordsHTML += '</tr>';
                        }
                        recordsHTML += '</tbody></table>';
                        recordsContainer.innerHTML = recordsHTML;
                    } else {
                        recordsContainer.innerHTML = '<p>No artwork records found. <a href="insert.html">Create one now!</a></p>';
                    }
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('records-container').innerHTML = '<p class="text-danger">Error loading records.</p>';
            });
